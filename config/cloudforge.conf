# CloudForge Load Balancer
# Route. Scale. Protect.

# Required quiet-mode demonstration defaults
initial_servers=20
total_cycles=100000
initial_queue_per_server=100

# Random task duration range
min_processing_time=5
max_processing_time=50

# Dynamic scaling thresholds
lower_queue_per_server=50
upper_queue_per_server=80
scale_cooldown=100
minimum_servers_per_balancer=1

# Runtime traffic generation
new_request_probability=0.20
blocked_traffic_rate=0.05

# Reproducible random simulation
random_seed=412

# Quiet mode for required 20-server, 100000-cycle log
verbose=false

# Firewall and output settings
blocked_prefix=203.0.113.
log_file=logs/cloudforge_quiet.log